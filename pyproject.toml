[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "survstudio"
dynamic = ["version"]
description = "Local survival analysis workbench: Kaplan-Meier, Cox, honest prognostic marker evaluation, and ML/DL model comparison"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Keunsoo Kang" }]
keywords = [
  "survival analysis",
  "Kaplan-Meier",
  "Cox proportional hazards",
  "prognostic markers",
  "biomarker",
  "multiple testing",
  "machine learning",
  "REMARK",
  "TRIPOD+AI",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# The app imports pydantic (v2 API: ConfigDict, field_validator, model_validator) and starlette
# directly, so both are declared rather than left to fastapi, which also accepts pydantic 1.
dependencies = [
  "fastapi>=0.115.0",
  "jinja2>=3.1.4",
  "numpy>=1.26.0",
  "pandas>=2.2.2",
  "plotly>=6.0.0",
  "pydantic>=2.0",
  "python-multipart>=0.0.9",
  "scipy>=1.13.0",
  "starlette>=0.37.2",
  "statsmodels>=0.14.4",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
formats = [
  "openpyxl>=3.1.5",
  "pyarrow>=17.0.0",
  "xlrd>=2.0.1",
]
ml = [
  "scikit-learn>=1.4.0",
  "scikit-survival>=0.23.0",
  "shap>=0.45.0",
]
dl = [
  "scikit-learn>=1.4.0",
  "torch>=2.0.0",
]
# Reference packages for validation/agreement/run_agreement.py (R survival is also needed).
validation = [
  "lifelines>=0.29.0",
  "scikit-survival>=0.23.0",
]
e2e = [
  "playwright>=1.52.0",
]
# Every runtime feature (formats, ML, DL, and kaleido for rendering figures to PNG/SVG
# from Python). Test tools live in dev / e2e.
all = [
  "openpyxl>=3.1.5",
  "pyarrow>=17.0.0",
  "xlrd>=2.0.1",
  "scikit-learn>=1.4.0",
  "scikit-survival>=0.23.0",
  "shap>=0.45.0",
  "torch>=2.0.0",
  "kaleido>=0.2.1",
]
dev = [
  "httpx>=0.28.1",
  "kaleido>=0.2.1",
  "openpyxl>=3.1.5",
  "pyarrow>=17.0.0",
  "pytest>=8.3.5",
  "scikit-survival>=0.23.0",
  "shap>=0.45.0",
  "torch>=2.0.0",
  "xlrd>=2.0.1",
]

[project.urls]
Homepage = "https://github.com/kangk1204/SurvStudio"
Source = "https://github.com/kangk1204/SurvStudio"
Issues = "https://github.com/kangk1204/SurvStudio/issues"
Changelog = "https://github.com/kangk1204/SurvStudio/blob/main/RELEASE_NOTES.md"

[project.scripts]
survstudio = "survival_toolkit.__main__:main"
# The original command name keeps working.
survival-toolkit = "survival_toolkit.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "survival_toolkit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
survival_toolkit = [
  "data/*.csv",
  "templates/*.html",
  "static/*.css",
  "static/*.js",
  "static/vendor/*.js",
  "static/fonts/*.woff2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
