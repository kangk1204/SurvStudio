name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-14
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install SurvStudio with dev dependencies
        run: pip install -e ".[dev]"

      - name: CLI smoke test
        shell: bash
        run: |
          printf 'os_months,os_event,age\n12,1,60\n18,0,55\n' > survstudio_smoke.csv
          survstudio inspect survstudio_smoke.csv > survstudio_profile.json
          test -s survstudio_profile.json
          survival-toolkit inspect survstudio_smoke.csv > /dev/null

      - name: Run test suite
        run: pytest -q

  frontend:
    name: Front-end script syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check every script and the page's shared script scope
        run: |
          for script in src/survival_toolkit/static/*.js; do
            node --check "$script"
          done
          # index.html loads the app scripts as classic scripts that share one global
          # scope, so their concatenation in load order must parse as well: a duplicate
          # top-level declaration across two files would break the page.
          cd src/survival_toolkit
          scripts=$(grep -o 'static/app[a-z_]*\.js' templates/index.html)
          cat $scripts > "$RUNNER_TEMP/survstudio-page-scripts.js"
          node --check "$RUNNER_TEMP/survstudio-page-scripts.js"

  package:
    name: Wheel install smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/pip" install dist/*.whl

      - name: Serve the page, its static files, and bundled data from the wheel
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-env/bin/survstudio" serve --port 8765 > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/api/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/api/health
          curl -fsS http://127.0.0.1:8765/ -o index.html
          curl -fsS http://127.0.0.1:8765/static/styles.css -o styles.css
          assets="$(grep -o 'static/[^"?]*' index.html) $(grep -o 'fonts/[^")]*' styles.css | sed 's|^|static/|')"
          for asset in $(echo "$assets" | tr ' ' '\n' | sort -u); do
            curl -fsS -o /dev/null "http://127.0.0.1:8765/$asset" || { echo "Missing packaged asset: $asset"; cat server.log; exit 1; }
          done
          curl -fsS -X POST http://127.0.0.1:8765/api/load-tcga-example -o tcga.json
          grep -q '"dataset_id"' tcga.json
          "$RUNNER_TEMP/wheel-env/bin/python" -c "from survival_toolkit.marker_qualification import qualification; assert qualification('linear', 'marker-inference/1')['status'] == 'failed_exploratory_only'"
          "$RUNNER_TEMP/wheel-env/bin/python" -c "from survival_toolkit.marker_diagnostics import METHOD_VERSION; from survival_toolkit.marker_qualification import qualification; assert METHOD_VERSION == 'marker-inference/2'; gate = qualification('linear', METHOD_VERSION); assert gate['status'] == 'passed_supported_conditions_only' and gate['kernel_sources_match']; assert qualification('restricted_cubic_spline', METHOD_VERSION)['status'] == 'failed_exploratory_only'"

  numerical-agreement:
    name: Numerical agreement with R survival
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
      - name: Install system dependency required by Hmisc's fs dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev
      - name: Install validation dependencies
        run: |
          pip install -e ".[validation]"
          Rscript -e 'packages <- c("survival", "jsonlite", "Hmisc"); install.packages(packages, repos="https://cloud.r-project.org"); stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly=TRUE)))'
      - name: Check numerical agreement
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python validation/agreement/run_agreement.py --output "${{ runner.temp }}/numerical-agreement" --check
      - name: Check fixed spline transforms and guarded-inference numerical reference
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python validation/guarded_inference/run_independent_reference.py --output "${{ runner.temp }}/guarded-reference"
      - name: Check finite coefficient cancellation and genuine separation with R
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python validation/diagnostic_followup/verify_reference.py --output "${{ runner.temp }}/diagnostic-followup-reference"
      - name: Check v3 joint diagnostic candidates against independent R
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python validation/publication_v3/verify_reference.py --output "${{ runner.temp }}/joint-diagnostic-reference"
      - name: Check prespecified case transforms and fixed predictions with synthetic data
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python validation/publication_v3/verify_case_reference.py --self-test --output "${{ runner.temp }}/case-synthetic-reference"
      - name: Check independent R aggregation with unresolved and zero-denominator fixtures
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python validation/publication_v3/verify_aggregate_reference.py --self-test --output "${{ runner.temp }}/aggregate-synthetic-reference"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aggregate-synthetic-reference
          path: ${{ runner.temp }}/aggregate-synthetic-reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case-synthetic-reference
          path: ${{ runner.temp }}/case-synthetic-reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-diagnostic-reference
          path: ${{ runner.temp }}/joint-diagnostic-reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numerical-agreement
          path: ${{ runner.temp }}/numerical-agreement
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guarded-reference
          path: ${{ runner.temp }}/guarded-reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-followup-reference
          path: ${{ runner.temp }}/diagnostic-followup-reference

  browser-e2e:
    name: ubuntu-latest / Python 3.11 / browser-e2e
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install SurvStudio with browser test dependencies
        run: pip install -e ".[dev,e2e]"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser E2E smoke test
        run: pytest -q tests/test_browser_e2e.py tests/test_guarded_marker_surfaces.py tests/test_v3_marker_surfaces.py
