   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="267.732" y="54.593025" transform="rotate(-0 267.732 54.593025)">Declare event, endpoint, marker and clinical roles</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="267.732" y="103.146068" transform="rotate(-0 267.732 103.146068)">Prespecify clinical basis: linear default or five-knot spline</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="267.732" y="151.699112" transform="rotate(-0 267.732 151.699112)">Fit transformations within training rows; retain a fixed recipe</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(139.004578 202.943099)">Clinical PH and form; marker residual mean and variance</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(154.918406 213.74556)">Separate Holm families, fixed 1% withholding rule</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(187.468875 255.542229)">Apply the method engineering gate</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(192.208641 266.34469)">Failed profiles remain exploratory</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(85.616297 308.14136)">Retain raw calculations</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(55.874109 318.94382)">Exploratory p/q and fitted prediction</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(315.995794 308.14136)">Carry inference state and reasons</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(318.315403 318.94382)">API, screen, figures, CSV, reports</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(148.3245 364.786577)">Apply fixed external transformations and coefficients</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(169.722703 375.589038)">Preserve state; report endpoints separately</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="10.5894" y="27.435151" transform="rotate(-0 10.5894 27.435151)">SurvStudio conditional marker workflow</text>
   </g>
